<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hronik — веб-разработчик</title>
<meta name="description" content="Портфолио веб-разработчика Hronik">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0a0a0f; --bg-2:#101018; --surface:#13131c; --surface-2:#1a1a26;
  --text:#e8eaf0; --muted:#8b90a0; --border:rgba(255,255,255,.08);
  --accent:#3b82f6; --accent-soft:rgba(59,130,246,.14); --accent-glow:rgba(59,130,246,.35);
  --on-accent:#fff; --grid:rgba(255,255,255,.035); --header-bg:rgba(10,10,15,.72);
  --shadow:0 20px 50px -20px rgba(0,0,0,.7);
  --ease:cubic-bezier(.22,1,.36,1);
  --rain:#00d4ff;
  --copper:#c8803f;
  --cf-text:rgba(205,218,238,.88);--cf-glow:rgba(0,212,255,.4);--cf-k:#00d4ff;--cf-s:#ffa657;--cf-c:#6e7b8f;--cf-f:#d2a8ff;--cf-p:#79c0ff;
  --font-h:'Space Grotesk',system-ui,sans-serif; --font-b:'Inter',system-ui,sans-serif; --font-m:'JetBrains Mono',ui-monospace,monospace;
}
[data-theme="light"]{
  --bg:#f5f6fa; --bg-2:#eceef5; --surface:#ffffff; --surface-2:#f0f2f8;
  --text:#111320; --muted:#5b6176; --border:rgba(15,20,50,.1);
  --accent:#1e40af; --accent-soft:rgba(30,64,175,.1); --accent-glow:rgba(30,64,175,.28);
  --grid:rgba(15,20,50,.05); --header-bg:rgba(245,246,250,.75);
  --shadow:0 20px 50px -24px rgba(20,30,80,.35);
  --rain:#0097bd;
  --copper:#a65f25;
  --cf-text:#3b4a63;--cf-glow:rgba(0,151,189,.22);--cf-k:#0086a8;--cf-s:#c2570a;--cf-c:#7b8497;--cf-f:#7c3aed;--cf-p:#1d4ed8;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font-b);background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden;transition:background .5s var(--ease),color .5s var(--ease);-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:56px 56px;mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 80%);-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 80%)}
::selection{background:var(--accent);color:var(--on-accent)}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:10px;border:2px solid var(--bg)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--font-h);line-height:1.1;letter-spacing:-.02em}
.container{width:min(1180px,100% - 48px);margin-inline:auto}
section{padding:110px 0;scroll-margin-top:130px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 26px;border-radius:12px;font-weight:600;font-size:15px;
  transition:transform .35s var(--ease),box-shadow .35s var(--ease),background .3s,border-color .3s,color .3s;position:relative;overflow:hidden}
.btn-primary{background:var(--accent);color:var(--on-accent);box-shadow:0 8px 28px -8px var(--accent-glow)}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 16px 36px -8px var(--accent-glow)}
.btn-ghost{border:1px solid var(--border);background:transparent;color:var(--text)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-3px)}
.btn-sm{padding:9px 16px;font-size:13px;border-radius:10px}
.btn-danger{border:1px solid rgba(239,68,68,.4);color:#ef4444}
.btn-danger:hover{background:rgba(239,68,68,.12)}
.btn:active{transform:scale(.97)}
@keyframes btnGlitch {
  0%   { translate: 0 0; }
  20%  { translate: -1px 1px; }
  40%  { translate: 1px -1px; }
  60%  { translate: -1px -1px; }
  80%  { translate: 1px 1px; }
  100% { translate: 0 0; }
}
.btn:hover:not(:disabled), .tab:hover, .icon-btn:hover { animation: btnGlitch .28s ease-in-out 2; text-shadow: 1px 0 #3b82f6, -1px 0 #00d4ff; }
.btn:focus-visible:not(:disabled), .tab:focus-visible, .icon-btn:focus-visible { animation: btnGlitch .28s ease-in-out 2; text-shadow: 1px 0 #3b82f6, -1px 0 #00d4ff; }
.btn:focus-visible,.icon-btn:focus-visible,.chip:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
header.site{position:fixed;top:0;left:0;right:0;z-index:50;padding:18px 0;transition:padding .4s var(--ease),background .4s,backdrop-filter .4s,border-color .4s;border-bottom:1px solid transparent}
header.site.scrolled{padding:11px 0;background:var(--header-bg);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-color:var(--border)}
.nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;row-gap:10px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-h);font-weight:700;font-size:22px;letter-spacing:-.03em;user-select:none}
.pulse{width:9px;height:9px;border-radius:50%;background:#22c55e;position:relative}
.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;background:#22c55e;animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
.nav-right{display:flex;align-items:center;gap:6px}
.nav-links{display:flex;gap:4px;margin-right:10px}
.nav-links a{padding:8px 14px;border-radius:10px;font-size:14px;color:var(--muted);transition:color .25s,background .25s}
.nav-links a:hover{color:var(--text);background:var(--accent-soft)}
.icon-btn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted);transition:color .25s,background .25s,transform .35s var(--ease)}
.icon-btn:hover{color:var(--accent);background:var(--accent-soft)}
.icon-btn svg{width:19px;height:19px}
.lang-btn{font-family:var(--font-m);font-size:13px;font-weight:500;width:auto;padding:0 12px;border:1px solid var(--border)}
.theme-btn .sun{display:none}[data-theme="light"] .theme-btn .sun{display:block}[data-theme="light"] .theme-btn .moon{display:none}
.burger{display:none}
.tabs{flex:0 0 100%;order:3;display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 18px;border-radius:100px;border:1px solid var(--border);font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap;transition:color .3s,background .3s,border-color .3s,transform .35s var(--ease),box-shadow .35s}
.tab:hover{color:var(--text);border-color:var(--accent);transform:translateY(-2px)}
.tab.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 8px 22px -10px var(--accent-glow)}
.tab-plus{width:38px;padding:8px 0;text-align:center;border-style:dashed;font-size:17px;line-height:1.2}
.tab-plus:hover{color:var(--accent)}

/* Hero */
.hero{min-height:100vh;display:flex;align-items:center;padding:175px 0 80px;position:relative;overflow:hidden;isolation:isolate;--hh:100vh}
.hero-grid{display:grid;grid-template-columns:1fr 1.05fr;gap:48px;align-items:center;position:relative;z-index:10}

/* Layer 1: falling code */
.code-rain{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none}
.rain-col{position:absolute;top:0;writing-mode:vertical-rl;white-space:nowrap;font-family:var(--font-m);color:var(--rain);opacity:.15;filter:blur(1px);letter-spacing:.06em;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 65%);mask-image:linear-gradient(to bottom,transparent,#000 65%);
  animation:rainFall linear infinite;will-change:transform}
@keyframes rainFall{from{transform:translateY(-100%)}to{transform:translateY(var(--hh,100vh))}}
.code-rain.paused .rain-col{animation-play-state:paused}


/* Layer 2: frameless code flow */
.codeflow{--lines:14;position:relative;z-index:10;justify-self:end;width:100%;max-width:560px;height:calc(var(--lines) * 1.75em);
  padding:2px 0 2px 24px;font-family:var(--font-m);font-size:14px;line-height:1.75;color:var(--cf-text);
  text-shadow:0 0 14px var(--cf-glow);overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 10%,#000 88%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 10%,#000 88%,transparent 100%)}
.cf-code{margin:0;min-width:0;white-space:pre;overflow:hidden;font:inherit}
.cf-code code{font:inherit}
.cf-code .k{color:var(--cf-k)}
.cf-code .s{color:var(--cf-s)}
.cf-code .c{color:var(--cf-c);font-style:italic}
.cf-code .f{color:var(--cf-f)}
.cf-code .p,.cf-code .n{color:var(--cf-p)}
.cf-caret{display:inline-block;width:.55em;height:1.15em;background:#00d4ff;box-shadow:0 0 10px var(--cf-glow);vertical-align:-.2em;margin-left:1px;animation:blink 1s steps(1) infinite}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:var(--font-m);font-size:13px;color:var(--accent);padding:7px 14px;border:1px solid var(--accent-soft);background:var(--accent-soft);border-radius:100px;margin-bottom:28px}
.hero h1{font-size:clamp(40px,6.6vw,86px);font-weight:700;margin-bottom:26px}
.hero h1 .grad{background:linear-gradient(100deg,var(--accent),#7dd3fc 70%);-webkit-background-clip:text;background-clip:text;color:transparent}
[data-theme="light"] .hero h1 .grad{background:linear-gradient(100deg,#1e40af,#3b82f6);-webkit-background-clip:text;background-clip:text}
.hero-sub{font-size:clamp(16px,1.6vw,20px);color:var(--muted);margin-bottom:38px;font-weight:500}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap}

/* Section heads */
.section-head{display:flex;align-items:center;gap:18px;margin-bottom:44px}
.section-head::before{content:"";width:5px;height:38px;border-radius:4px;background:var(--accent);box-shadow:0 0 20px var(--accent-glow)}
.section-head h2{font-size:clamp(30px,4vw,46px)}

[hidden]{display:none!important}
.panel-actions{display:flex;align-items:center;gap:8px}
.login-panel{width:min(400px,100%)}
.form-error{color:#ef4444;font-size:13.5px;min-height:20px;margin:-4px 0 0}
.detail .lead{font-size:19px;color:var(--muted);margin:-14px 0 34px;white-space:pre-wrap}
/* Admin categories */
.sec-title{font-family:var(--font-h);font-size:18px;margin:8px 0 12px}
.catm-add{display:flex;gap:10px;margin-bottom:12px}
.catm-add input{flex:1}
.prow small{color:var(--muted);font-family:var(--font-m);font-size:12px;flex:none;margin-left:auto}
.prow input.ren{flex:1;padding:8px 12px;font-size:14px}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:26px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;
  transition:transform .5s var(--ease),box-shadow .5s var(--ease),border-color .4s}
.card:hover{transform:translateY(-8px);border-color:var(--accent);box-shadow:0 24px 50px -16px var(--accent-glow)}
.card-media{aspect-ratio:16/10;overflow:hidden;background:var(--surface);padding:10px;display:grid;place-items:center;color:var(--accent)}
.card-media img{width:100%;height:100%;object-fit:cover;border-radius:12px;box-shadow:0 8px 30px -12px rgba(0,0,0,.5);transition:transform .8s var(--ease)}
.card:hover .card-media img{transform:scale(1.08)}
.card-media svg{width:54px;height:54px;opacity:.85}
.card-body{padding:22px 22px 24px;display:flex;flex-direction:column;gap:12px;flex:1}
.card h3{font-size:22px}
.badges{display:flex;flex-wrap:wrap;gap:7px}
.badge{font-size:12px;padding:4px 11px;border-radius:100px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.card-date{margin-top:auto;font-family:var(--font-m);font-size:12.5px;color:var(--muted)}
.empty{grid-column:1/-1;text-align:center;padding:70px 20px;border:1.5px dashed var(--border);border-radius:22px}
.empty p{color:var(--muted);margin-bottom:22px;font-size:18px}
.skel{background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden}
.skel i{display:block;background:linear-gradient(100deg,var(--surface-2) 30%,var(--bg-2) 50%,var(--surface-2) 70%);background-size:300% 100%;animation:shimmer 1.4s linear infinite}
.skel .s1{aspect-ratio:16/10}.skel .s2{height:20px;width:65%;margin:22px 22px 12px;border-radius:6px}.skel .s3{height:14px;width:40%;margin:0 22px 24px;border-radius:6px}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}

/* About */
.about-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:60px;align-items:start}
.about h3{font-size:clamp(28px,3.4vw,42px)}
.about-text p{color:var(--muted);font-size:18px;margin-bottom:20px}
.about-text p:last-child{margin:0;color:var(--text)}

/* Contacts */
.contacts{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.contact{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px 28px;display:flex;flex-direction:column;gap:14px;transition:transform .5s var(--ease),box-shadow .5s var(--ease),border-color .4s;overflow:hidden;position:relative}
.contact:hover{transform:translateY(-8px);border-color:var(--accent);box-shadow:0 24px 50px -16px var(--accent-glow)}
.contact .ico{width:54px;height:54px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;transition:transform .5s var(--ease)}
.contact:hover .ico{transform:rotate(-8deg) scale(1.1)}
.contact .ico svg{width:26px;height:26px}
.contact h4{font-family:var(--font-h);font-size:22px}
.contact span{color:var(--muted);font-size:15px;word-break:break-all}
.contact .arrow{position:absolute;top:26px;right:26px;color:var(--muted);transition:transform .4s var(--ease),color .3s}
.contact:hover .arrow{transform:translate(4px,-4px);color:var(--accent)}

/* Footer */
footer{border-top:1px solid var(--border);padding:34px 0;color:var(--muted);font-size:14px}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px}
.foot b{color:var(--accent);font-family:var(--font-m);font-weight:500}

.features-list{list-style:none;margin:0;padding:0}
.features-list li{position:relative;padding-left:24px;margin-bottom:8px;font-size:18px}
.features-list li::before{content:"✓";position:absolute;left:0;color:var(--copper);font-weight:700}
.btn-site{background:#22c55e;color:#fff;box-shadow:0 8px 28px -8px rgba(34,197,94,.4)}
.btn-site:hover{background:#16a34a;transform:translateY(-3px);box-shadow:0 16px 36px -8px rgba(34,197,94,.5)}
/* Глитч — битые пиксели */
.glitch-pixel{position:absolute;pointer-events:none;border-radius:2px;opacity:.7;animation:glitchPixelFade .35s ease-out forwards}
@keyframes glitchPixelFade{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(.5)}}
/* Reviews */
.star{font-size:24px;line-height:1;color:#555;cursor:pointer;transition:color .2s;user-select:none}
.star.filled,.star:hover{color:#3b82f6}
.star:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.rv-card{cursor:default;padding:20px;gap:12px}
.rv-name{display:block;font-family:var(--font-h);font-weight:700;font-size:18px;overflow-wrap:anywhere}
.rv-project{display:block;color:var(--muted);font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.rv-stars{display:flex;gap:2px}
.rv-stars .star{font-size:16px;cursor:default}
.rv-stars .star:not(.filled):hover{color:#555}
.rv-text{color:var(--muted);font-size:15.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.stars-input{display:flex;gap:4px}
.stars-input .star{font-size:28px}
#reviewForm{margin-top:22px}
#reviewForm textarea{min-height:110px}
/* Stats */
.stats{padding:20px 0 0}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.stat{position:relative;padding:32px 26px 28px;border:1px solid var(--border);border-radius:20px;background:var(--surface);overflow:hidden;transition:transform .5s var(--ease),box-shadow .5s var(--ease),border-color .4s}
.stat::before{content:"";position:absolute;left:26px;right:26px;top:0;height:2px;background:linear-gradient(90deg,var(--accent),transparent);opacity:.7}
.stat:hover{transform:translateY(-6px);border-color:var(--accent);box-shadow:0 24px 50px -18px var(--accent-glow)}
.stat-num{font-family:var(--font-h);font-weight:700;font-size:clamp(42px,4.8vw,64px);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;background:linear-gradient(100deg,var(--text) 35%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat-label{margin-top:12px;color:var(--muted);font-size:15px}
.count-badge{align-self:center;font-family:var(--font-m);font-size:14px;color:var(--accent);background:var(--accent-soft);padding:4px 13px;border-radius:100px}
/* Services */
.services{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.svc{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:30px 26px;transition:transform .5s var(--ease),box-shadow .5s var(--ease),border-color .4s}
.svc:hover{transform:translateY(-8px);border-color:var(--accent);box-shadow:0 24px 50px -16px var(--accent-glow)}
.svc .ico{width:54px;height:54px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:22px;transition:transform .5s var(--ease)}
.svc:hover .ico{transform:rotate(-8deg) scale(1.1)}
.svc .ico svg{width:26px;height:26px}
.svc h3{font-size:21px;margin-bottom:10px}
.svc p{color:var(--muted);font-size:15px}
/* CTA */
.cta{padding:40px 0 120px}
.cta-box{position:relative;text-align:center;padding:96px 24px;border:1px solid var(--border);border-radius:32px;overflow:hidden;
  background:var(--surface)}
.cta-title{font-size:clamp(54px,12vw,168px);letter-spacing:-.045em;line-height:1;padding-bottom:.08em;background:linear-gradient(100deg,var(--text) 30%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.cta-sub{margin:22px auto 40px;max-width:640px;color:var(--muted);font-size:clamp(17px,2vw,24px)}
.btn-lg{padding:18px 36px;font-size:17px;border-radius:14px}
/* Reveal */
.reveal{opacity:0;transform:translateY(34px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.reveal.in{opacity:1;transform:none}

/* Floating buttons */
.fab{position:fixed;right:22px;z-index:40}
.to-top{bottom:78px;width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 10px 26px -8px var(--accent-glow);opacity:0;transform:translateY(20px) scale(.8);pointer-events:none;transition:all .5s var(--ease)}
.to-top.show{opacity:1;transform:none;pointer-events:auto}
.to-top:hover{transform:translateY(-4px)}
.to-top svg{width:20px;height:20px}
.admin-zone{position:fixed;right:0;bottom:0;width:90px;height:90px;z-index:39;display:grid;place-items:center}
.admin-trigger{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--border);color:var(--accent);display:grid;place-items:center;opacity:0;transform:scale(.7);transition:all .4s var(--ease)}
.admin-zone:hover .admin-trigger,.admin-trigger:focus-visible{opacity:1;transform:none}
.admin-trigger svg{width:18px;height:18px}

/* Toasts */
.toasts{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none;width:min(440px,100% - 32px)}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:13px 18px;border-radius:14px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);font-size:14.5px;animation:toastIn .5s var(--ease);width:100%}
.toast.out{animation:toastOut .4s var(--ease) forwards}
.toast .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--accent);box-shadow:0 0 12px var(--accent-glow)}
.toast.success .dot{background:#22c55e;box-shadow:0 0 12px rgba(34,197,94,.5)}
.toast.error .dot{background:#ef4444;box-shadow:0 0 12px rgba(239,68,68,.5)}
@keyframes toastIn{from{opacity:0;transform:translateY(24px) scale(.95)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(12px) scale(.95)}}

/* Cursor */
.cursor{position:fixed;top:0;left:0;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px var(--accent-glow);z-index:1000;pointer-events:none;opacity:0;transition:opacity .3s,width .3s var(--ease),height .3s var(--ease),margin .3s var(--ease)}
.cursor.on{opacity:1}
.cursor.big{width:34px;height:34px;margin:-17px 0 0 -17px;opacity:.35}
@media (hover:none),(max-width:768px){.cursor{display:none}}
@media (hover:hover) and (min-width:769px){body.has-cursor,body.has-cursor a,body.has-cursor button{cursor:none}}

/* Intro */
.intro{position:fixed;inset:0;z-index:500;background:#06060a;color:#e8eaf0;display:flex;align-items:center;justify-content:center;font-family:var(--font-m);overflow-x:hidden;overflow-y:auto;transition:transform 1.1s var(--ease),opacity 1.1s var(--ease)}
.intro.leave{transform:translateY(-100%);opacity:0;pointer-events:none}
.intro.gone{display:none}
.vlines{position:absolute;inset:0;pointer-events:none}
.vline{position:absolute;top:-40%;width:1px;background:linear-gradient(to bottom,transparent,rgba(59,130,246,.55),transparent);opacity:.35;animation:fall linear infinite}
@keyframes fall{from{transform:translateY(0)}to{transform:translateY(190vh)}}
.intro-inner{position:relative;width:min(640px,100% - 40px);z-index:1;margin:auto;padding:64px 0 36px}
.intro-lang{position:absolute;top:22px;left:22px;z-index:2;color:#8b90a0;font-family:var(--font-m);font-size:13px;border:1px solid rgba(255,255,255,.12);padding:8px 14px;border-radius:10px;transition:all .3s}
.intro-lang:hover{color:#3b82f6;border-color:#3b82f6}
.term{min-height:0;font-size:clamp(13px,1.9vw,16px);line-height:1.7;color:#7d8aa5;text-align:left;transition:opacity .6s,transform .6s var(--ease),min-height .6s}
.term .ln{white-space:pre-wrap}
.term .ln .p{color:#3b82f6}
.term .ok{color:#22c55e}
.term.done{opacity:.3;transform:translateY(-6px) scale(.95);transform-origin:top left}
.caret{display:inline-block;width:.6em;height:1.1em;background:#3b82f6;vertical-align:-.2em;margin-left:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.intro-hero{margin-top:34px;text-align:center;opacity:0;transform:translateY(20px);transition:opacity .9s var(--ease),transform .9s var(--ease);pointer-events:none}
.intro-hero.show{opacity:1;transform:none;pointer-events:auto}
.glitch{font-family:var(--font-h);font-weight:700;font-size:clamp(28px,5.6vw,54px);line-height:1.15;min-height:1.15em;position:relative;display:block;color:#fff;letter-spacing:-.02em}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;inset:0;opacity:.6;clip-path:inset(0 0 100% 0);transform:none;will-change:clip-path,transform}
.glitch::before{color:#00cccc;animation:gl1 3s steps(1) infinite}
.glitch::after{color:#cc3388;animation:gl2 2.7s steps(1) infinite}
@keyframes gl1{
  0%,85.9%{clip-path:inset(0 0 100% 0);transform:none}
  86%{clip-path:inset(12% 0 62% 0);transform:translate(-5px,0)}
  87%{clip-path:inset(0 0 100% 0);transform:none}
  90%{clip-path:inset(58% 0 14% 0);transform:translate(4px,0)}
  91%{clip-path:inset(0 0 100% 0);transform:none}
  94%{clip-path:inset(34% 0 38% 0);transform:translate(-2px,0)}
  95%{clip-path:inset(0 0 100% 0);transform:none}
}
@keyframes gl2{
  0%,87.9%{clip-path:inset(0 0 100% 0);transform:none}
  88%{clip-path:inset(48% 0 24% 0);transform:translate(6px,0)}
  89%{clip-path:inset(0 0 100% 0);transform:none}
  92%{clip-path:inset(6% 0 70% 0);transform:translate(-3px,0)}
  93%{clip-path:inset(0 0 100% 0);transform:none}
  96%{clip-path:inset(68% 0 6% 0);transform:translate(2px,0)}
  97%{clip-path:inset(0 0 100% 0);transform:none}
}
.intro-hero .glitch+.glitch{margin-top:10px;color:#9fb4d8;font-size:clamp(20px,3.4vw,32px);font-weight:500}
.intro-actions{display:flex;gap:14px;justify-content:center;margin-top:36px;flex-wrap:wrap;font-family:var(--font-b)}
.intro .btn-ghost{color:#e8eaf0;border-color:rgba(255,255,255,.18)}
.intro .btn-primary{background:#3b82f6}
.intro-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.intro-pct{position:absolute;top:26px;right:24px;z-index:2;font-family:var(--font-m);font-size:13px;color:#7d8aa5;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.intro-pct b{color:#00d4ff;font-weight:500;text-shadow:0 0 12px rgba(0,212,255,.6)}
.term .rule{display:block;height:1px;margin:3px 0 5px;background:linear-gradient(90deg,rgba(0,212,255,.55),rgba(59,130,246,.18) 70%,transparent);transform:scaleX(0);transform-origin:left;transition:transform .7s var(--ease)}
.term .rule.go{transform:scaleX(1)}
.intro-line{height:2px;width:min(340px,70%);margin:26px auto 0;background:linear-gradient(90deg,transparent,#00d4ff,transparent);box-shadow:0 0 16px rgba(0,212,255,.7);transform:scaleX(0);opacity:0;transition:transform 1s var(--ease),opacity .6s}
.intro-line.on{transform:scaleX(1);opacity:1;animation:linePulse 2.2s ease-in-out 1s infinite}
@keyframes linePulse{0%,100%{opacity:.35;box-shadow:0 0 6px rgba(0,212,255,.3);transform:scaleX(.82)}50%{opacity:1;box-shadow:0 0 22px rgba(0,212,255,.85);transform:scaleX(1)}}
.intro-actions .btn{opacity:0;transform:translateY(70px)}
.intro-actions.go .btn{opacity:1;transform:none;animation:bounceUp .95s cubic-bezier(.34,1.56,.64,1) backwards}
.intro-actions.go .btn:nth-child(2){animation-delay:.2s}
@keyframes bounceUp{0%{opacity:0;transform:translateY(70px)}55%{opacity:1;transform:translateY(-14px)}78%{transform:translateY(5px)}100%{opacity:1;transform:none}}

/* Detail */
.detail{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;opacity:0;transform:translateY(40px);visibility:hidden;pointer-events:none;transition:opacity .6s var(--ease),transform .6s var(--ease),visibility 0s .6s}
.detail.open{opacity:1;transform:none;visibility:visible;pointer-events:auto;transition:opacity .6s var(--ease),transform .6s var(--ease)}
.detail-top{position:sticky;top:0;z-index:5;padding:14px 0;background:var(--header-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.detail-wrap{width:min(960px,100% - 40px);margin:0 auto;padding:36px 0 90px}
.gallery{position:relative;border-radius:22px;overflow:hidden;background:var(--surface);border:1px solid var(--border);margin-bottom:26px;user-select:none}
.g-track{display:flex;transition:transform .7s var(--ease);touch-action:pan-y}
.g-slide{min-width:100%;aspect-ratio:16/9;display:grid;place-items:center;background:var(--surface);padding:10px}
.g-slide img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;border-radius:12px;box-shadow:0 8px 30px -12px rgba(0,0,0,.5);-webkit-user-drag:none}
.g-arrow{position:absolute;top:calc(50% - 19px);transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(10,10,15,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font-size:20px;line-height:1;display:grid;place-items:center;transition:background .3s,transform .3s var(--ease)}
.g-arrow:hover{background:var(--copper);transform:translateY(-50%) scale(1.1)}
.g-arrow.prev{left:16px}.g-arrow.next{right:16px}
.g-counter{padding:10px 18px;text-align:right;font-family:var(--font-m);font-size:13px;color:var(--muted)}
.g-dots{position:absolute;left:0;right:0;bottom:50px;display:flex;justify-content:center;gap:8px;pointer-events:none}
.g-dots i{pointer-events:auto;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.45);cursor:pointer;transition:all .4s var(--ease)}
.g-dots i.on{background:var(--copper);width:24px;border-radius:6px}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:34px}
.file-card{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--border);background:var(--surface);border-radius:16px}
.file-card .fi{width:46px;height:46px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.file-card .fi svg{width:22px;height:22px}
.file-card .meta{min-width:0;flex:1}
.file-card .meta b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-card .meta small{color:var(--muted);font-size:12px}
.detail h1{font-size:clamp(34px,6vw,64px);margin:10px 0 18px}
.detail .meta-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:42px}
.block{border-left:3px solid var(--accent);padding:6px 0 6px 24px;margin-bottom:34px}
.block h4{font-family:var(--font-m);font-weight:500;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.block p{font-size:18px;color:var(--text);white-space:pre-wrap}

/* Admin */
.modal{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(5,5,10,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:opacity .4s var(--ease),visibility 0s .4s}
.modal.open{opacity:1;visibility:visible;transition:opacity .4s var(--ease)}
.panel{width:min(780px,100%);max-height:92vh;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:30px;box-shadow:var(--shadow);transform:translateY(30px) scale(.97);transition:transform .5s var(--ease)}
.modal.open .panel{transform:none}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.panel-head h3{font-size:26px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.plist{border:1px solid var(--border);border-radius:16px;max-height:200px;overflow-y:auto;margin-bottom:12px}
.plist:empty::before{content:attr(data-empty);display:block;padding:18px;color:var(--muted);font-size:14px;text-align:center}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border)}
.prow:last-child{border:none}
.prow span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.prow div{display:flex;gap:8px;flex:none}
.storage{font-family:var(--font-m);font-size:12px;color:var(--muted);margin-bottom:20px}
.storage .bar{height:4px;background:var(--surface-2);border-radius:4px;margin-top:6px;overflow:hidden}
.storage .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .6s var(--ease)}
form hr{border:none;border-top:1px solid var(--border);margin:6px 0 20px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px;font-weight:500}
.field label em{color:#ef4444;font-style:normal}
input[type=text],input[type=password],input[type=url],input[type=date],select,textarea{width:100%;background:var(--bg-2);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;transition:border-color .25s,box-shadow .25s;color-scheme:dark}
[data-theme="light"] input[type=date],[data-theme="light"] input[type=url],[data-theme="light"] select{color-scheme:light}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:84px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cat-box{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.cat-box .badge{display:inline-flex;align-items:center;gap:6px}
.cat-box .badge button{color:inherit;font-size:15px;line-height:1;opacity:.7}.cat-box .badge button:hover{opacity:1}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px;border:1.5px dashed var(--border);border-radius:14px;color:var(--muted);cursor:pointer;transition:all .3s;text-align:center;font-size:14px}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.drop input{display:none}
.flist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.fitem{display:flex;align-items:center;gap:12px;padding:8px 12px;border:1px solid var(--border);border-radius:12px;background:var(--bg-2);font-size:13.5px}
.fitem .th{width:38px;height:38px;border-radius:8px;overflow:hidden;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.fitem .th img{width:100%;height:100%;object-fit:cover}
.fitem .th svg{width:18px;height:18px}
.fitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitem small{color:var(--muted)}
.fitem button{color:var(--muted);font-size:18px;width:28px;height:28px;border-radius:8px}.fitem button:hover{background:rgba(239,68,68,.15);color:#ef4444}
.form-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:24px;flex-wrap:wrap}

/* Mobile */
@media (max-width:900px){
  .hero-grid{grid-template-columns:1fr;gap:34px}.codeflow{order:-1;max-width:none;justify-self:stretch}
  .about-grid{grid-template-columns:1fr;gap:26px}.contacts{grid-template-columns:1fr}
}
@media (max-width:768px){
  section{padding:76px 0}.container{width:calc(100% - 32px)}
  .burger{display:grid}
  .nav-links{position:absolute;top:100%;left:0;right:0;flex-direction:column;margin:0;padding:10px 16px 16px;background:var(--bg);border-bottom:1px solid var(--border);transform:translateY(-12px);opacity:0;pointer-events:none;transition:all .4s var(--ease)}
  .nav-links.open{transform:none;opacity:1;pointer-events:auto}
  .nav-links a{padding:13px 12px;font-size:16px}
  .grid{grid-template-columns:1fr}.hero{padding-top:150px;min-height:auto}
  .card:hover,.contact:hover{transform:none}
  .reveal{transform:translateY(18px);transition-duration:.6s}
  .row2{grid-template-columns:1fr}.panel{padding:22px 18px;border-radius:20px}
  .codeflow{font-size:11.5px;padding-left:16px}
  .g-arrow{width:40px;height:40px}.fab{right:16px}.to-top{bottom:74px}
  .foot{flex-direction:column}
}
@media (max-width:1000px){.services,.stats-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.services{grid-template-columns:1fr}.cta-box{padding:64px 18px}.stat{padding:24px 18px 20px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>

<!-- INTRO -->
<div class="intro" id="intro">
  <canvas class="intro-canvas" id="introCanvas" aria-hidden="true"></canvas>
  <div class="vlines" id="vlines"></div>
  <button class="intro-lang" id="introLang" aria-label="Language">RU / EN</button>
  <div class="intro-pct" id="introPct" aria-hidden="true"></div>
  <div class="intro-inner">
    <div class="term" id="term" aria-live="polite"></div>
    <div class="intro-hero" id="introHero">
      <span class="glitch" id="g1" data-text=""></span>
      <span class="glitch" id="g2" data-text=""></span>
      <div class="intro-line" id="introLine"></div>
      <div class="intro-actions" id="introActions">
        <button class="btn btn-primary" id="introYes" data-i18n="intro_yes"></button>
        <button class="btn btn-ghost" id="introLater" data-i18n="intro_later"></button>
      </div>
    </div>
  </div>
</div>

<!-- HEADER -->
<header class="site" id="header">
  <div class="container nav">
    <a href="#top" class="logo" id="logo" aria-label="Hronik"><span class="pulse"></span>Hronik</a>
    <div class="nav-right">
      <nav class="nav-links" id="navLinks">
        <a href="#projects" data-i18n="nav_projects"></a>
        <a href="#about" data-i18n="nav_about"></a>
        <a href="#reviews" data-i18n="nav_reviews">Отзывы</a>
        <a href="#contacts" data-i18n="nav_contacts"></a>
      </nav>
      <button class="icon-btn lang-btn" id="langBtn" aria-label="Language">RU</button>
      <button class="icon-btn theme-btn" id="themeBtn" aria-label="Theme">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="icon-btn burger" id="burger" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
  </div>
</header>

<main id="top">
  <!-- HERO -->
  <section class="hero" id="hero">
    <div class="code-rain" id="codeRain" aria-hidden="true"></div>
    <div class="container hero-grid">
      <div>
        <div class="eyebrow reveal"><span class="pulse"></span><span data-i18n="eyebrow"></span></div>
        <h1 class="reveal" style="transition-delay:.1s"><span data-i18n="hero_a"></span> <span class="grad" data-i18n="hero_b"></span></h1>
        <p class="hero-sub reveal" style="transition-delay:.2s" data-i18n="hero_sub"></p>
        <div class="hero-actions reveal" style="transition-delay:.3s">
          <a href="#projects" class="btn btn-primary"><span data-i18n="hero_cta"></span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg></a>
          <a href="#contacts" class="btn btn-ghost" data-i18n="nav_contacts"></a>
        </div>
      </div>
      <div class="codeflow reveal" style="transition-delay:.25s" aria-hidden="true">
        <pre class="cf-code"><code id="vscCode"></code><i class="cf-caret"></i></pre>
      </div>
    </div>
  </section>

  <!-- STATS -->
  <section class="stats" id="stats">
    <div class="container stats-grid">
      <div class="stat reveal"><div class="stat-num"><span class="count" id="statProjects" data-count="0">0</span></div><div class="stat-label" data-i18n="stat_projects"></div></div>
      <div class="stat reveal" style="transition-delay:.08s"><div class="stat-num"><span class="count" data-count="3">0</span></div><div class="stat-label" data-i18n="stat_years"></div></div>
      <div class="stat reveal" style="transition-delay:.16s"><div class="stat-num"><span class="count" data-count="100">0</span><span>%</span></div><div class="stat-label" data-i18n="stat_clients"></div></div>
      <div class="stat reveal" style="transition-delay:.24s"><div class="stat-num"><span class="count" data-count="24">0</span><span>/7</span></div><div class="stat-label" data-i18n="stat_support"></div></div>
    </div>
  </section>

  <!-- PROJECTS -->
  <section id="projects">
    <div class="container">
      <div class="section-head reveal"><h2 data-i18n="projects_title"></h2><span class="count-badge" id="projCount">0</span></div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <!-- ABOUT -->
  <section id="about">
    <div class="container about-grid">
      <div class="reveal">
        <div class="section-head" style="margin-bottom:26px"><h2 data-i18n="about_title"></h2></div>
        <h3 style="color:var(--muted);font-weight:500;font-size:clamp(20px,2.4vw,26px);letter-spacing:-.01em" data-i18n="about_head"></h3>
      </div>
      <div class="about-text reveal" style="transition-delay:.15s">
        <p data-i18n="about_p1"></p>
        <p data-i18n="about_p2"></p>
        <p data-i18n="about_p3"></p>
      </div>
    </div>
  </section>

  <!-- SERVICES -->
  <section id="services">
    <div class="container">
      <div class="section-head reveal"><h2 data-i18n="svc_title"></h2></div>

/* intro particles: 30-50 points linked by lines, they react to the cursor */
let introRaf = 0, introCleanup = null;
function startParticles() {
  const cv = $('#introCanvas'), intro = $('#intro');
  if (!cv || !cv.getContext) return;
  const ctx = cv.getContext('2d'); if (!ctx) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0;
  const mouse = { x: -9999, y: -9999 };
  const resize = () => {
    W = intro.clientWidth; H = intro.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  resize();
  const N = W < 768 ? 32 : 46, LINK = W < 768 ? 105 : 150, MR = 170;
  const pts = Array.from({ length: N }, () => {
    const bx = (Math.random() - .5) * .4, by = (Math.random() - .5) * .4;
    return { x: Math.random() * W, y: Math.random() * H, bx, by, vx: bx, vy: by, r: 1 + Math.random() * 1.5 };
  });
  const move = e => { const q = e.touches ? e.touches[0] : e; mouse.x = q.clientX; mouse.y = q.clientY; };
  const leave = () => { mouse.x = mouse.y = -9999; };
  intro.addEventListener('mousemove', move); intro.addEventListener('mouseleave', leave);
  intro.addEventListener('touchmove', move, { passive: true }); intro.addEventListener('touchend', leave);
  addEventListener('resize', resize);
  const frame = () => {
    ctx.clearRect(0, 0, W, H);
    for (const p of pts) {
      const dx = p.x - mouse.x, dy = p.y - mouse.y, d = Math.hypot(dx, dy);
      if (d < MR && d > 0) { const f = (1 - d / MR) * .09; p.vx += dx / d * f; p.vy += dy / d * f; }
      p.vx += (p.bx - p.vx) * .012; p.vy += (p.by - p.vy) * .012;
      p.x += p.vx; p.y += p.vy;
      if (p.x < -10) p.x = W + 10; else if (p.x > W + 10) p.x = -10;
      if (p.y < -10) p.y = H + 10; else if (p.y > H + 10) p.y = -10;
    }
    for (let i = 0; i < N; i++) {
      const a = pts[i];
      for (let j = i + 1; j < N; j++) {
        const b = pts[j], d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d < LINK) { ctx.strokeStyle = 'rgba(59,130,246,' + ((1 - d / LINK) * .35).toFixed(3) + ')'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
      }
      const dm = Math.hypot(a.x - mouse.x, a.y - mouse.y);
      if (dm < MR) { ctx.strokeStyle = 'rgba(0,212,255,' + ((1 - dm / MR) * .55).toFixed(3) + ')'; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke(); }
      ctx.fillStyle = 'rgba(0,212,255,.75)'; ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, 6.2832); ctx.fill();
    }
    introRaf = requestAnimationFrame(frame);
  };
  frame();
  introCleanup = () => {
    cancelAnimationFrame(introRaf);
    intro.removeEventListener('mousemove', move); intro.removeEventListener('mouseleave', leave);
    intro.removeEventListener('touchmove', move); intro.removeEventListener('touchend', leave);
    removeEventListener('resize', resize);
  };
}

async function runIntro() {
  const token = ++introToken;
  const term = $('#term'), hero = $('#introHero'), pct = $('#introPct'), line = $('#introLine'), actions = $('#introActions');
  const g1 = $('#g1'), g2 = $('#g2');
  term.innerHTML = ''; term.classList.remove('done');
  hero.classList.remove('show'); line.classList.remove('on'); actions.classList.remove('go');
  g1.textContent = ''; g1.dataset.text = ''; g2.textContent = ''; g2.dataset.text = '';
  const setPct = v => { pct.innerHTML = esc(t('intro_loading')) + ' <b>' + v + '%</b>'; };
  setPct(0);
  const caret = document.createElement('span'); caret.className = 'caret';
  const lines = I18N[lang].intro_lines.map(l => l.replace('{n}', projects.length));
  const total = lines.reduce((n, l) => n + l.length, 0);
  let typed = 0;
  for (let i = 0; i < lines.length; i++) {
    const ln = document.createElement('div'); ln.className = 'ln';
    const p = document.createElement('span'); p.className = 'p'; p.textContent = '> ';
    const txt = document.createElement('span');
    ln.append(p, txt, caret); term.appendChild(ln);
    for (const ch of lines[i]) {
      if (token !== introToken) return;
      txt.textContent += ch; typed++;
      setPct(Math.min(99, Math.floor(typed / total * 100)));
      await sleep(ch === ' ' ? 12 : 14 + Math.random() * 16);
    }
    if (i === lines.length - 1) {
      const ok = document.createElement('span'); ok.className = 'ok'; ok.textContent = '✓'; txt.appendChild(ok);
    }
    const rule = document.createElement('i'); rule.className = 'rule'; term.appendChild(rule);
    void rule.offsetWidth; rule.classList.add('go');   // thin line grows left -> right
    await sleep(i === lines.length - 1 ? 350 : 130);
  }
  if (token !== introToken) return;
  setPct(100);
  await sleep(800);
  if (token !== introToken) return;
  caret.remove(); term.classList.add('done'); hero.classList.add('show');
  const type = async (el, str, delay) => {
    for (let i = 1; i <= str.length; i++) {
      if (token !== introToken) return false;
      el.textContent = str.slice(0, i); el.dataset.text = str.slice(0, i);
      await sleep(delay);
    }
    return true;
  };
  if (!(await type(g1, t('intro_h1'), 55))) return;
  await sleep(250);
  if (!(await type(g2, t('intro_h2'), 40))) return;
  
  // Glitch effect: random timing, random number of glitching characters, each with its own lifetime
  if (glitchInterval) clearTimeout(glitchInterval);
  const chars = '█▓▒░@#$%&?!+=~'.split('');
  const colors = ['var(--accent)', 'var(--rain)'];
  const gNodes = [g1, g2];
  const rnd = (a, b) => a + Math.random() * (b - a);
  const live = new Map(gNodes.map(el => [el, new Map()]));   // el -> (char index -> {ch, color})
  const draw = el => {
    const m = live.get(el), txt = (el.dataset.text || '').split('');
    el.innerHTML = txt.map((c, i) => {
      const g = m.get(i);
      return g ? `<span style="color:${g.color};text-shadow:0 0 8px ${g.color}">${esc(g.ch)}</span>` : esc(c);
    }).join('');
  };
  const glitchChar = () => {
    if (token !== introToken) return;
    const el = gNodes[Math.floor(Math.random() * gNodes.length)];
    const txt = el.dataset.text || '', m = live.get(el);
    const idx = Math.floor(Math.random() * txt.length);
    if (!txt || txt[idx] === ' ' || m.has(idx)) return;
    m.set(idx, { ch: chars[Math.floor(Math.random() * chars.length)], color: colors[Math.floor(Math.random() * colors.length)] });
    draw(el);
    setTimeout(() => {                       // each character recovers on its own
      m.delete(idx);
      if (token === introToken) draw(el);
    }, rnd(350, 1100));
  };
  const burst = () => {
    if (token !== introToken) return;
    const r = Math.random();
    const count = r < 0.35 ? 1 : r < 0.65 ? 2 : r < 0.85 ? 3 : r < 0.95 ? 4 : 6 + Math.floor(Math.random() * 3);  // sometimes a big burst
    for (let k = 0; k < count; k++) setTimeout(glitchChar, k * rnd(40, 320));   // characters do not start in sync
    glitchInterval = setTimeout(burst, rnd(500, 3200));                        // irregular pause before the next burst
  };
  glitchInterval = setTimeout(burst, rnd(400, 1500));

  line.classList.add('on');
  await sleep(500);
  if (token !== introToken) return;
  actions.classList.add('go');   // buttons bounce up
}

// Приводит данные (в т.ч. старого формата с тегами-строками) к модели: категория = {id, name}, у проекта одно поле category (id)
function normalizeData(rp, rc) {
  let cats = [];
  if (rc === null || rc === undefined) cats = DEFAULT_CATS.map(c => ({ ...c }));
  else if (Array.isArray(rc)) rc.forEach(c => {
    if (typeof c === 'string' && c.trim()) cats.push({ id: uid(), name: c.trim() });
    else if (c && typeof c === 'object' && c.id && (c.name || c.key)) cats.push({ id: String(c.id), name: String(c.name || ''), ...(c.key ? { key: String(c.key) } : {}) });
  });
  const seen = new Set(); cats = cats.filter(c => !seen.has(c.id) && seen.add(c.id));
  const byName = n => cats.find(c => catLabel(c).toLowerCase() === n.toLowerCase() || c.name.toLowerCase() === n.toLowerCase());
  const list = (Array.isArray(rp) ? rp : []).filter(p => p && typeof p.title === 'string').map(p => {
    let category = typeof p.category === 'string' && cats.some(c => c.id === p.category) ? p.category : '';
    if (!category) {
      const legacy = Array.isArray(p.categories) ? p.categories.map(String).filter(Boolean) : [];
      if (legacy.length) { let c = byName(legacy[0]); if (!c) { c = { id: uid(), name: legacy[0] }; cats.push(c); } category = c.id; }
    }
    const { categories: _legacy, ...rest } = p;
    return { ...rest, category };
  });
  return { projects: list, cats };
}

// DB stores a category as text: the key for built-in ones ('sites'), the name for custom ones
function canonCat(v) {

  return d ? d.key : v;
}
const catDbValue = c => c ? (c.key || c.name) : '';
function catIdFromDb(value) {
  const v = canonCat(value); if (!v) return '';

  });

}
function closeDetail() {

}
function setSlide(i, instant) {
  if (!gCount) return;
  gIndex = (i + gCount) % gCount;
  const tr = $('#gTrack'); if (!tr) return;
  if (instant) tr.style.transition = 'none';
  tr.style.transform = `translateX(-${gIndex * 100}%)`;
  if (instant) { tr.offsetWidth; tr.style.transition = ''; }
  $$('#gDots i').forEach((d, k) => d.classList.toggle('on', k === gIndex));
  const cur = $('#gCur'); if (cur) cur.textContent = gIndex + 1;
  $$('#gTrack video').forEach(v => v.pause());
}
function bindGallery() {
  const g = $('#gallery');
  if (!g || g.dataset.bound === '1') return;   // bind only once per gallery element
  g.dataset.bound = '1';
  const dots = $('#gDots'); if (dots) dots.innerHTML = Array.from({ length: gCount }, (_, i) => `<i data-i="${i}"></i>`).join('');
  g.addEventListener('click', e => {
    if (e.target.closest('.prev')) setSlide(gIndex - 1);
    else if (e.target.closest('.next')) setSlide(gIndex + 1);
    else if (e.target.dataset.i !== undefined) setSlide(+e.target.dataset.i);
  });
  let sx = 0, sy = 0, tracking = false;
  g.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; tracking = true; }, { passive: true });
  g.addEventListener('touchend', e => {
    if (!tracking) return; tracking = false;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (gCount > 1 && Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) setSlide(gIndex + (dx < 0 ? 1 : -1));
  });
}

function normalizeFeatures(v) {
  let arr = v;
  if (typeof arr === 'string') { try { arr = JSON.parse(arr); } catch { arr = arr.split('\n'); } }
  return Array.isArray(arr) ? arr.map(x => String(x).trim()).filter(Boolean) : [];

const safeUrl = u => /^https?:\/\//i.test(String(u || '').trim()) ? String(u).trim() : '';
function normalizeImages(v) {
  let arr = v;
  if (typeof arr === 'string') { try { arr = JSON.parse(arr); } catch { arr = []; } }
  if (!Array.isArray(arr)) return [];
  return arr.map((x, i) => {
    if (typeof x === 'string' && x.startsWith('data:')) return { name: 'image-' + (i + 1), type: (x.match(/^data:([^;,]+)/) || [])[1] || 'image/*', size: Math.round(x.length * .75), data: x };
    if (typeof x === 'string' && /^https:\/\//i.test(x)) return { name: 'image-' + (i + 1), type: 'image/*', size: 0, data: x };
    if (x && typeof x === 'object') {
      const d = typeof x.data === 'string' ? x.data : (typeof x.url === 'string' ? x.url : '');
      if (d.startsWith('data:') || /^https:\/\//i.test(d)) return { name: String(x.name || 'file-' + (i + 1)), type: String(x.type || (d.startsWith('data:') ? '' : 'image/*')), size: +x.size || 0, data: d };
    }
    return null;
  }).filter(Boolean);
}

async function saveRobust(table, payload, isEdit, editId) {
  let currentPayload = { ...payload };
  while(true) {
    let res;
    if (isEdit) res = await supabaseClient.from(table).update(currentPayload).eq('id', editId).select('id');
    else res = await supabaseClient.from(table).insert([currentPayload]);

    if (res.error && res.error.message && res.error.message.includes("Could not find the")) {
      const match = res.error.message.match(/'([^']+)' column/);
      if (match && match[1]) {
        delete currentPayload[match[1]];
        console.warn(`[Hronik] Supabase: column missing '${match[1]}', retrying without it.`);
        continue;
      }
    }
    return res;
  }
}

  if (!supabaseClient) return toast(t('t_no_db'), 'error', 6000);

  const { data, error } = await supabaseClient.from('projects').delete().eq('id', p.dbId).select('id');
  if (error) { toast(t('t_error') + ': ' + error.message, 'error', 6000); return; }
  if (!data || !data.length) { toast(t('t_error') + ': ' + t('t_no_rights'), 'error', 6000); return; }
  if (editingId === id) resetForm();
  await refreshProjects();
  toast(t('t_deleted'), 'success');
}

/* ---------- export / import / migrate ---------- */
function exportJSON() {
  const rows = projects.map(p => ({ title: p.title, summary: p.summary, description: p.description, link: p.link, features: p.features, task: p.task, solution: p.solution, result: p.result,
    category: catDbValue(catById(p.category)), date: p.date, images: p.files }));
  const blob = new Blob([JSON.stringify({ version: 3, exported: new Date().toISOString(), projects: rows }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'hronik-projects-' + todayStr() + '.json'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast(t('t_export'), 'success');
}
function resolveImportCat(p, cats) {
  const cs = Array.isArray(cats) ? cats : [];
  let v = '';
  if (typeof p.category === 'string' && p.category) {
    const c = cs.find(x => x && typeof x === 'object' && String(x.id) === p.category);
    v = c ? (c.key || c.name || '') : p.category;
  } else if (Array.isArray(p.categories) && p.categories.length) v = String(p.categories[0]);
  return canonCat(v);
}
async function importProjects(parsed) {
  if (!supabaseClient) throw new Error('no db');
  const list = Array.isArray(parsed) ? parsed : parsed && parsed.projects;
  if (!Array.isArray(list)) throw new Error('bad format');
  const cats = Array.isArray(parsed) ? [] : parsed.categories;
  const rows = list.filter(p => p && typeof p.title === 'string').map(p => ({
    title: p.title, summary: p.summary || '', description: p.description || '', link: safeUrl(p.link), features: normalizeFeatures(p.features), task: p.task || '', solution: p.solution || '', result: p.result || '',
    category: resolveImportCat(p, cats), date: p.date || todayStr(), images: normalizeImages(p.images ?? p.files)
  }));
  log('import: проектов к загрузке:', rows.length);
  let ok = 0;
  for (const row of rows) {
    const { error } = await supabaseClient.from('projects').insert([row]);
    if (error) { log('import: ошибка', error.message); toast(t('t_error') + ': ' + error.message, 'error', 6000); break; }
    ok++;
  }
  await refreshProjects();
  return { ok, total: rows.length };
}
async function importJSON(file) {
  try {
    const r = await importProjects(JSON.parse(await file.text()));
    if (r.ok) toast(t('t_import', { n: r.ok }), 'success');
  } catch { toast(t('t_import_err'), 'error'); }
}
const legacyProjects = () => (Array.isArray(rawProjects) && !store.get('hronik_migrated', false)) ? rawProjects.filter(p => p && typeof p.title === 'string') : [];
function updateMigrateBtn() { const n = legacyProjects().length, b = $('#migrateBtn'); b.hidden = !n; b.textContent = t('migrate', { n }); }
async function migrateLocal() {
  const list = legacyProjects(); if (!list.length) return;
  $('#migrateBtn').disabled = true;
  try {
    const r = await importProjects({ projects: list, categories: Array.isArray(rawCats) ? rawCats : [] });
    if (r.total && r.ok === r.total) { store.set('hronik_migrated', true); toast(t('t_migrated', { n: r.ok }), 'success'); }
  } catch { toast(t('t_import_err'), 'error'); }
  $('#migrateBtn').disabled = false; updateMigrateBtn();
}

  let user = null;

/* ---------- hero: code rain + VS Code window ---------- */
const RAIN_BITS = ['const', 'let', 'function', '=>', '</div>', '<section>', 'display:flex', 'await', 'fetch()', 'return', 'import', 'export', 'class', '{ }', 'grid', '0x1f', '</>', 'async', 'map()', 'px', 'flex', ';', '&&', '[...]', 'null', 'true', '.hero', 'z-index', 'new', '===', '<a href>', 'npm run dev'];
function buildRain() {
  const hero = $('#hero'), box = $('#codeRain');
  if (!hero || !box) return;
  const w = hero.clientWidth, h = hero.clientHeight;
  hero.style.setProperty('--hh', h + 'px');
  box.innerHTML = '';
  const n = Math.max(8, Math.round(w / (w < 768 ? 46 : 54)));
  const frag = document.createDocumentFragment();
  for (let i = 0; i < n; i++) {
    const col = document.createElement('div'); col.className = 'rain-col';
    let txt = ''; const len = 14 + Math.floor(Math.random() * 20);
    for (let k = 0; k < len; k++) txt += RAIN_BITS[Math.floor(Math.random() * RAIN_BITS.length)] + ' ';
    col.textContent = txt.trim();
    col.style.left = ((i + Math.random() * .6) / n * 100).toFixed(2) + '%';
    col.style.fontSize = (11 + Math.floor(Math.random() * 4)) + 'px';
    col.style.animationDuration = (10 + Math.random() * 20).toFixed(1) + 's';
    col.style.animationDelay = (-Math.random() * 30).toFixed(1) + 's';
    frag.appendChild(col);
  }
  box.appendChild(frag);
}
function initRain() {
  buildRain();
  let rt;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(buildRain, 250); });
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(es => $('#codeRain').classList.toggle('paused', !es[0].isIntersecting), { threshold: 0 }).observe($('#hero'));
  }
}

const VSC_SNIPPETS = [
`// собираем hero
const hero = document.createElement('section');
hero.className = 'hero';

const title = document.createElement('h1');
title.textContent = 'Создаю сайты, которые решают задачи';

const cta = document.createElement('a');
cta.href = '#projects';
cta.textContent = 'Смотреть проекты';

hero.append(title, cta);
document.body.prepend(hero);`,
`// стили hero: сетка и анимации
Object.assign(hero.style, {
  display: 'grid',
  placeItems: 'center',
  minHeight: '100vh',
  background: '#0a0a0f',
  transition: 'transform .5s',
});

cta.addEventListener('mouseenter', () => {
  cta.style.transform = 'translateY(-3px)';
  cta.style.boxShadow = '0 8px 28px #3b82f6';
});`,
`// плавное появление блоков при скролле
const io = new IntersectionObserver((entries) => {
  entries.forEach((e) => {
    if (e.isIntersecting) {
      e.target.classList.add('in');
      io.unobserve(e.target);
    }
  });
}, { threshold: 0.15 });

document.querySelectorAll('.reveal')
  .forEach((el) => io.observe(el));`
];
const VSC_KW = /^(const|let|var|function|return|await|async|new|if|else|for|of|in|class|import|from|export|true|false|null|document|this)$/;
function vscHighlight(src) {
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?(?:\*\/|$))|('[^'\n]*'?|"[^"\n]*"?)|(\b\d[\d.]*\b)|([A-Za-z_$][\w$]*)|([\s\S])/g;
  let out = '', m;
  while ((m = re.exec(src))) {
    const tok = m[0];
    if (m[1]) out += '<span class="c">' + esc(tok) + '</span>';
    else if (m[2]) out += '<span class="s">' + esc(tok) + '</span>';
    else if (m[3]) out += '<span class="n">' + esc(tok) + '</span>';
    else if (m[4]) {
      const rest = src.slice(re.lastIndex, re.lastIndex + 2);
      if (VSC_KW.test(tok)) out += '<span class="k">' + tok + '</span>';
      else if (rest[0] === '(') out += '<span class="f">' + tok + '</span>';
      else if (/^\s*:/.test(rest) && rest.trim()[0] === ':') out += '<span class="p">' + tok + '</span>';
      else out += tok;
    } else out += esc(tok);
  }
  return out;
}
let vscStarted = false;
async function startVsc() {
  if (vscStarted) return; vscStarted = true;
  const code = $('#vscCode');
  if (!code) return;
  const render = txt => { code.innerHTML = vscHighlight(txt); };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { render(VSC_SNIPPETS[0]); return; }
  let i = 0;
  for (;;) {
    const text = VSC_SNIPPETS[i++ % VSC_SNIPPETS.length];
    for (let n = 1; n <= text.length; n++) { render(text.slice(0, n)); await sleep(40); }   // 40 ms / char
    await sleep(2600);
    for (let n = text.length; n > 0; n -= 3) { render(text.slice(0, n)); await sleep(12); }  // erase
    render('');
    await sleep(600);
  }
}

/* ---------- stats counters ---------- */
let statsSeen = false;
function animateCount(el, to, dur = 1500) {
  const from = +el.dataset.cur || 0;
  cancelAnimationFrame(el._raf);
  if (from === to) { el.textContent = to; el.dataset.cur = to; return; }
  const t0 = performance.now();
  const tick = now => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 4);
    el.textContent = Math.round(from + (to - from) * e);
    if (k < 1) el._raf = requestAnimationFrame(tick); else el.dataset.cur = to;
  };
  el._raf = requestAnimationFrame(tick);
}
function updateProjectsCount() {
  const n = projects.length, el = $('#statProjects'), badge = $('#projCount');
  if (el) { el.dataset.count = n; if (statsSeen) animateCount(el, n, 900); }
  if (badge) badge.textContent = n;
  log('счётчик проектов =', n);
}
function initStats() {
  const grid = $('.stats-grid'); if (!grid) return;
  const run = () => { statsSeen = true; $$('.count').forEach(el => animateCount(el, +el.dataset.count || 0)); };
  if (!('IntersectionObserver' in window)) return run();
  const o = new IntersectionObserver(es => { if (es[0].isIntersecting) { run(); o.disconnect(); } }, { threshold: .35 });
  o.observe(grid);
}

/* ---------- reveal ---------- */
let io;
function initReveal() {
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .12, rootMargin: '0px 0px -40px 0px' });
  observe(document);
}
function observe(root) { if (!io) return; $$('.reveal:not(.in)', root).forEach(el => io.observe(el)); }

/* ---------- cursor ---------- */
function initCursor() {
  if (!matchMedia('(hover:hover) and (min-width:769px)').matches) return;
  const c = $('#cursor'); document.body.classList.add('has-cursor');
  let x = 0, y = 0, cx = 0, cy = 0;
  addEventListener('mousemove', e => { x = e.clientX; y = e.clientY; c.classList.add('on'); });
  document.addEventListener('mouseleave', () => c.classList.remove('on'));
  document.addEventListener('mouseover', e => c.classList.toggle('big', !!e.target.closest('a,button,.card,.chip,.drop,input,textarea,.g-dots i')));
  (function loop() { cx += (x - cx) * .22; cy += (y - cy) * .22; c.style.transform = `translate(${cx}px,${cy}px)`; requestAnimationFrame(loop); })();
}

/* ---------- events ---------- */
function bind() {
  $('#introLang').onclick = toggleLang;
  $('#langBtn').onclick = toggleLang;
  $('#themeBtn').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; store.set(K.theme, theme); applyTheme(); };
  $('#introYes').onclick = closeIntro;
  $('#introLater').onclick = () => toast(t('toast_later'), 'info');
  $('#burger').onclick = () => $('#navLinks').classList.toggle('open');
  $('#navLinks').addEventListener('click', e => { if (e.target.closest('a')) $('#navLinks').classList.remove('open'); });

  $('#tabs').addEventListener('click', e => {
    if (e.target.closest('#tabPlus')) return requestAdmin('cats');
    const b = e.target.closest('.tab'); if (!b) return;
    activeCat = b.dataset.cat; renderTabs(); renderGrid();
    $('#projects').scrollIntoView({ behavior: 'smooth' });
  });
  $('#grid').addEventListener('click', e => {
    if (e.target.closest('#addFirst')) return requestAdmin();
    const c = e.target.closest('.card'); if (c) openDetail(c.dataset.id);
  });
  $('#grid').addEventListener('keydown', e => { if (e.key === 'Enter') { const c = e.target.closest('.card'); if (c) openDetail(c.dataset.id); } });
  $('#backBtn').onclick = closeDetail;
  $('#reviewForm').addEventListener('submit', saveReview);
  $('#reviewCancel').onclick = resetReviewForm;
  const stars = $('#rvStars');
  stars.addEventListener('mouseover', e => { const b = e.target.closest('.star'); if (b) paintStars(+b.dataset.val); });
  stars.addEventListener('mouseleave', () => paintStars(reviewRating));
  stars.addEventListener('click', e => { const b = e.target.closest('.star'); if (b) setRating(+b.dataset.val); });
  stars.addEventListener('keydown', e => {
    const b = e.target.closest('.star'); if (!b) return;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setRating(+b.dataset.val); return; }
    const d = (e.key === 'ArrowRight' || e.key === 'ArrowUp') ? 1 : (e.key === 'ArrowLeft' || e.key === 'ArrowDown') ? -1 : 0;
    if (!d) return; e.preventDefault();
    const n = Math.min(5, Math.max(1, (reviewRating || (d > 0 ? 0 : 6)) + d)); setRating(n); $$('.star', stars)[n - 1].focus();
  });
  $('#reviewsList').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) deleteReview(b.closest('.prow').dataset.rvid); });
  $('#detail').addEventListener('click', e => { if (e.target.closest('#backBtn2')) closeDetail(); });

  $('#adminOpen').onclick = () => requestAdmin();
  $('#adminClose').onclick = closeAdmin;
  $('#cancelBtn').onclick = () => { resetForm(); closeAdmin(); };
  $('#admin').addEventListener('mousedown', e => { if (e.target.id === 'admin') closeAdmin(); });
  $('#plist').addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const id = b.closest('.prow').dataset.id;
    b.dataset.act === 'edit' ? startEdit(id) : deleteProject(id);
  });
  $('#saveBtn').addEventListener('click', e => { log('click по кнопке «Сохранить»'); saveProject(e); });
  $('#form').addEventListener('submit', e => { e.preventDefault(); log('submit формы перехвачен (preventDefault)'); });
  $('#addCatBtn').onclick = addCategory;
  $('#newCat').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addCategory(); } });
  $('#catsList').addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const id = b.closest('.prow').dataset.id;
    if (b.dataset.act === 'ren') { renamingId = id; renderCatsAdmin(); }
    else if (b.dataset.act === 'ren-ok') commitRename(id);
    else if (b.dataset.act === 'ren-cancel') { renamingId = null; renderCatsAdmin(); }
    else if (b.dataset.act === 'delcat') deleteCategory(id);
  });
  $('#catsList').addEventListener('keydown', e => {
    if (!e.target.classList.contains('ren')) return;
    const id = e.target.closest('.prow').dataset.id;
    if (e.key === 'Enter') { e.preventDefault(); commitRename(id); }
    if (e.key === 'Escape') { e.stopPropagation(); renamingId = null; renderCatsAdmin(); }
  });
  $('#flist').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { formFiles.splice(+b.dataset.i, 1); renderFormFiles(); } });
  $('#fFiles').addEventListener('change', async e => { await addFiles([...e.target.files]); e.target.value = ''; });
  const drop = $('#drop');
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => addFiles([...e.dataTransfer.files]));
  $('#logoutBtn').onclick = doLogout;
  $('#migrateBtn').onclick = migrateLocal;
  $('#loginForm').addEventListener('submit', e => { e.preventDefault(); doLogin(); });
  $('#loginCancel').onclick = closeLogin; $('#loginClose').onclick = closeLogin;
  $('#login').addEventListener('mousedown', e => { if (e.target.id === 'login') closeLogin(); });
  $('#exportBtn').onclick = exportJSON;
  $('#importBtn').onclick = () => $('#importFile').click();
  $('#importFile').addEventListener('change', e => { const f = e.target.files[0]; if (f) importJSON(f); e.target.value = ''; });

  // hidden admin: logo x5 (mobile friendly)
  let clicks = 0, ct;
  $('#logo').addEventListener('click', () => { clicks++; clearTimeout(ct); ct = setTimeout(() => clicks = 0, 900); if (clicks >= 5) { clicks = 0; requestAdmin(); } });

  addEventListener('keydown', e => {
    if (e.ctrlKey && e.shiftKey && e.code === 'KeyA') { e.preventDefault(); $('#admin').classList.contains('open') ? closeAdmin() : requestAdmin(); return; }
    if (e.key === 'Escape') {
      if ($('#login').classList.contains('open')) closeLogin();
      else if ($('#admin').classList.contains('open')) closeAdmin(); else if (currentDetail) closeDetail();
    }
    if (currentDetail && gCount > 1 && !$('#admin').classList.contains('open')) {

    }
  });

  const header = $('#header'), top = $('#toTop');
  const onScroll = () => { header.classList.toggle('scrolled', scrollY > 30); top.classList.toggle('show', scrollY > 500); };
  addEventListener('scroll', onScroll, { passive: true }); onScroll();
  top.onclick = () => scrollTo({ top: 0, behavior: 'smooth' });
}
